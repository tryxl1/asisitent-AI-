<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Desktop Core</title>
    <script src="three.min.js"></script>
    <script src="GLTFLoader.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #d8f8ff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 8px;
            display: flex;
            align-items: stretch;
            justify-content: stretch;
        }

        .hud-container {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            background: rgba(8, 16, 28, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.8), 
                        0 0 35px rgba(0, 210, 255, 0.2),
                        inset 0 0 20px rgba(0, 240, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.2s ease;
        }

        .hud-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00f0ff;
            opacity: 0.9;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 6px;
        }


        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ffaa;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulse-dot 2s infinite ease-in-out;
        }

        /* Animated activity spinner / radar */
        .busy-spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 240, 255, 0.2);
            border-top-color: #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .busy-spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .stop-btn {
            color: #ff5566 !important;
            background: rgba(255, 60, 80, 0.15) !important;
            border: 1px solid rgba(255, 60, 80, 0.4) !important;
            display: none;
        }

        .stop-btn.visible {
            display: flex !important;
        }

        .stop-btn:hover {
            background: rgba(255, 60, 80, 0.35) !important;
            box-shadow: 0 0 10px rgba(255, 60, 80, 0.5) !important;
        }


        .icon-btn {
            background: transparent;
            border: none;
            color: #7de8ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: #fff;
            background: rgba(0, 240, 255, 0.2);
        }

        .close-btn:hover {
            color: #fff;
            background: rgba(255, 50, 70, 0.6) !important;
        }

        /* Avatar Container (Canvas or ThreeJS) */
        .avatar-wrapper {
            position: relative;
            width: 190px;
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 4px 0;
        }

        #avatarCanvas, #threeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .avatar-glow {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.45) 0%, rgba(0, 150, 255, 0.1) 60%, transparent 70%);
            filter: blur(10px);
            pointer-events: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .status-text {
            font-size: 12.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #7de8ff;
            margin-top: 2px;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            height: 18px;
        }

        /* Response Box */
        .response-box {
            width: 100%;
            flex: 1;
            min-height: 80px;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(4, 10, 18, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13.5px;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 240, 255, 0.4) transparent;
        }

        .response-box::-webkit-scrollbar {
            width: 5px;
        }
        .response-box::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.4);
            border-radius: 4px;
        }

        /* Controls Section */
        .controls-row {
            width: 100%;
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .model-select {
            flex: 1;
            background: rgba(10, 22, 38, 0.95);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 10px;
            color: #00f0ff;
            padding: 8px 12px;
            font-size: 12.5px;
            outline: none;
            cursor: pointer;
        }

        .model-select:hover, .model-select:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
        }

        .model-select option {
            background: #0a1420;
            color: #fff;
        }

        .voice-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8be6ff;
            cursor: pointer;
            background: rgba(0, 240, 255, 0.12);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }

        .voice-toggle input {
            cursor: pointer;
            accent-color: #00f0ff;
            width: 15px;
            height: 15px;
        }

        /* Prominent Input Bar */
        .input-bar {
            width: 100%;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: auto;
            padding-top: 4px;
        }

        .chat-input {
            flex: 1;
            background: rgba(8, 20, 36, 0.95);
            border: 1.5px solid rgba(0, 240, 255, 0.45);
            border-radius: 12px;
            padding: 11px 15px;
            font-size: 13.5px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .chat-input::placeholder {
            color: rgba(216, 248, 255, 0.5);
        }

        .chat-input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.45), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.35), rgba(0, 100, 255, 0.35));
            border: 1.5px solid rgba(0, 240, 255, 0.55);
            color: #00f0ff;
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
            font-size: 12.5px;
        }


        .btn:hover {
            background: linear-gradient(135deg, rgba(0, 220, 255, 0.45), rgba(0, 120, 255, 0.45));
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ddd;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .mic-btn.active {
            background: rgba(255, 60, 60, 0.3);
            border-color: #ff3344;
            color: #ff3344;
            box-shadow: 0 0 16px rgba(255, 50, 50, 0.6);
            animation: mic-pulse 1.2s infinite ease-in-out;
        }

        @keyframes mic-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .drag-bar {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            border-radius: 2px;
            background: rgba(0, 240, 255, 0.25);
            cursor: grab;
        }

        /* Settings Slide-in Drawer */
        .settings-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            background: rgba(8, 15, 26, 0.96);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: inset 0 0 25px rgba(0, 240, 255, 0.12);
            padding: 18px;
            display: flex;
            flex-direction: column;
            z-index: 50;
            transform: translateY(105%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .settings-panel.open {
            transform: translateY(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 8px;
            margin-bottom: 12px;
            color: #00f0ff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .settings-body {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-group label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8be6ff;
            font-weight: 600;
        }

        .setting-textarea {
            width: 100%;
            height: 90px;
            background: rgba(4, 10, 18, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            color: #d8f8ff;
            outline: none;
            resize: none;
            line-height: 1.4;
            font-family: inherit;
        }

        .setting-select {
            background: rgba(4, 10, 18, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 12px;
            color: #00f0ff;
            outline: none;
        }

        .market-links-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .settings-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="hud-container" id="hud">
        <div class="drag-bar" title="Přetáhnout widget"></div>

        <div class="hud-header">
            <span style="font-weight: 700;">J.A.R.V.I.S. Core // Bazzite</span>
            <div class="header-actions">
                <div class="status-badge">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="busy-spinner" id="busySpinner" title="AI právě pracuje / generuje..."></span>
                    <span id="headerStatus">ONLINE</span>
                </div>
                <!-- Stop / Cancel Action Button -->
                <button class="icon-btn stop-btn" id="stopActionBtn" title="Zastavit probíhající akci / mluvení">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="5" y="5" width="14" height="14" rx="2"></rect>
                    </svg>
                </button>
                <!-- Maximize / Restore button -->
                <button class="icon-btn" id="maximizeAppBtn" title="Maximalizovat / Obnovit velikost">

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="maxIcon">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                </button>
                <!-- Settings button -->
                <button class="icon-btn" id="openSettingsBtn" title="Nastavení avatara, kontextu a hlasu">

                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <!-- Close Button -->
                <button class="icon-btn close-btn" id="closeAppBtn" title="Úplně ukončit Jarvise">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Avatar Wrapper: Supports 2D Arc Reactor & 3D GLTF models -->
        <div class="avatar-wrapper" id="avatarBtn" title="Klikni pro hlasové zadání">
            <div class="avatar-glow" id="avatarGlow"></div>
            <canvas id="avatarCanvas" width="190" height="190"></canvas>
            <div id="threeContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;"></div>
        </div>

        <div class="status-text" id="statusText">PŘIPRAVEN K PŘÍKAZU</div>

        <div class="response-box" id="responseBox">
            Ahoj pane! Systém je inicializován a připraven. Můžete se mě na cokoliv zeptat hlasem nebo textem.
        </div>

        <div class="controls-row">
            <select class="model-select" id="modelSelect" title="Výběr AI modelu">
            </select>
            <label class="voice-toggle" title="Zapnout/vypnout hlasové odpovědi">
                <input type="checkbox" id="voiceToggle" checked>
                <span>Hlas TTS</span>
            </label>
        </div>

        <div class="input-bar">
            <input type="text" class="chat-input" id="chatInput" placeholder="Napište příkaz nebo dotaz..." autocomplete="off">
            <button class="btn mic-btn" id="micBtn" title="Kliknout pro mluvení">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" x2="12" y1="19" y2="22"></line>
                </svg>
            </button>
            <button class="btn" id="sendBtn" title="Odeslat">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>

        <!-- Settings Slide-in Drawer -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <span>Nastavení J.A.R.V.I.S.</span>
                <button class="icon-btn" id="closeSettingsBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="settings-body">
                <!-- Avatar Switcher -->
                <div class="setting-group">
                    <label>Aktivní Avatar</label>
                    <select class="setting-select" id="settingAvatar">
                        <option value="reactor">Holografický Reaktor (Arc Reactor)</option>
                        <!-- Dynamically filled with 3D avatars (.glb) -->
                    </select>
                </div>

                <!-- 3D Avatar Marketplace Shortcuts -->
                <div class="setting-group">
                    <label>Stáhnout 3D Avatary (Anime, Hry, Filmy)</label>
                    <div class="market-links-row">
                        <button class="btn btn-secondary" id="btnSketchfab" style="flex:1;">Sketchfab (3D)</button>
                        <button class="btn btn-secondary" id="btnModelsResource" style="flex:1;">TheModelsResource</button>
                        <button class="btn btn-secondary" id="btnOpenFolder" style="flex:1;">Otevřít složku</button>
                    </div>
                    <span style="font-size: 10.5px; opacity: 0.7; margin-top: 2px;">
                        Stačí stáhnout model v .GLB nebo .GLTF a vložit ho do složky avatarů.
                    </span>
                </div>

                <div class="setting-group">
                    <label>Hlas asistenta (TTS)</label>
                    <select class="setting-select" id="settingVoice">
                        <option value="cs-CZ-VlastaNeural">Čeština - Vlasta (Příjemný ženský hlas)</option>
                        <option value="cs-CZ-AntoninNeural">Čeština - Antonín (Mužský hlas)</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Systémový kontext / Instrukce pro AI</label>
                    <textarea class="setting-textarea" id="settingContext" placeholder="Definujte osobnost a pravidla..."></textarea>
                </div>
            </div>

            <div class="settings-footer">
                <button class="btn" id="saveSettingsBtn">Uložit nastavení</button>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let isListening = false;
        let isSpeaking = false;
        let isProcessing = false;
        let currentEnergy = 0.2;
        let targetEnergy = 0.2;

        const statusDot = document.getElementById('statusDot');
        const headerStatus = document.getElementById('headerStatus');
        const statusText = document.getElementById('statusText');
        const responseBox = document.getElementById('responseBox');
        const modelSelect = document.getElementById('modelSelect');
        const voiceToggle = document.getElementById('voiceToggle');
        const chatInput = document.getElementById('chatInput');
        const micBtn = document.getElementById('micBtn');
        const sendBtn = document.getElementById('sendBtn');
        const avatarGlow = document.getElementById('avatarGlow');

        // Settings elements
        const settingsPanel = document.getElementById('settingsPanel');
        const openSettingsBtn = document.getElementById('openSettingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingAvatar = document.getElementById('settingAvatar');
        const settingVoice = document.getElementById('settingVoice');
        const settingContext = document.getElementById('settingContext');
        const closeAppBtn = document.getElementById('closeAppBtn');

        // Three.js 3D Engine Setup
        let scene, camera, renderer, current3dModel, clock;
        const threeContainer = document.getElementById('threeContainer');
        const avatarCanvas = document.getElementById('avatarCanvas');
        let is3DMode = false;

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            camera.position.set(0, 0, 3);

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(190, 190);
            renderer.setPixelRatio(window.devicePixelRatio);
            threeContainer.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f0ff, 2.0);
            dirLight.position.set(2, 3, 4);
            scene.add(dirLight);

            clock = new THREE.Clock();
            animateThreeJS();
        }

        function load3DAvatar(filename) {
            if (current3dModel) {
                scene.remove(current3dModel);
                current3dModel = null;
            }

            if (!filename || filename === 'reactor') {
                is3DMode = false;
                threeContainer.style.display = 'none';
                avatarCanvas.style.display = 'block';
                return;
            }

            const loader = new THREE.GLTFLoader();
            loader.load(`avatars/${filename}`, (gltf) => {
                current3dModel = gltf.scene;

                // Center and scale model
                const box = new THREE.Box3().setFromObject(current3dModel);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z) || 1;
                const scale = 1.6 / maxDim;
                current3dModel.scale.set(scale, scale, scale);
                current3dModel.position.sub(center.multiplyScalar(scale));

                scene.add(current3dModel);
                is3DMode = true;
                avatarCanvas.style.display = 'none';
                threeContainer.style.display = 'block';
                console.log("3D Avatar loaded successfully:", filename);
            }, undefined, (err) => {
                console.error("Error loading 3D avatar:", err.message || err);
                is3DMode = false;
                threeContainer.style.display = 'none';
                avatarCanvas.style.display = 'block';
            });

        }

        function animateThreeJS() {
            requestAnimationFrame(animateThreeJS);
            if (is3DMode && current3dModel) {
                // Audio-reactive rotation & scale
                current3dModel.rotation.y += 0.015 + currentEnergy * 0.03;
                const dynamicScale = 1 + (currentEnergy - 0.2) * 0.3;
                current3dModel.position.y = Math.sin(Date.now() * 0.003) * 0.08;
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function connectWebSocket() {
            ws = new WebSocket('ws://127.0.0.1:8765');

            ws.onopen = () => {
                headerStatus.innerText = "ONLINE";
                statusDot.style.background = "#00ffaa";
                statusDot.style.boxShadow = "0 0 8px #00ffaa";
                ws.send(JSON.stringify({ action: "get_config" }));
                ws.send(JSON.stringify({ action: "get_avatars" }));
            };

            ws.onclose = () => {
                headerStatus.innerText = "OFFLINE";
                statusDot.style.background = "#ff3344";
                statusDot.style.boxShadow = "0 0 8px #ff3344";
                setTimeout(connectWebSocket, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleBackendMessage(data);
            };
        }

        function handleBackendMessage(data) {
            switch(data.type) {
                case 'config_data':
                    modelSelect.innerHTML = '';
                    data.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m;
                        opt.innerText = m;
                        if (m === data.current_model) opt.selected = true;
                        modelSelect.appendChild(opt);
                    });
                    settingVoice.value = data.voice || "cs-CZ-VlastaNeural";
                    settingContext.value = data.context || "";
                    if (data.avatar) {
                        settingAvatar.value = data.avatar;
                        load3DAvatar(data.avatar);
                    }
                    break;

                case 'avatars_list':
                    // Keep the first reactor option
                    settingAvatar.innerHTML = '<option value="reactor">Holografický Reaktor (Arc Reactor)</option>';
                    data.avatars.forEach(file => {
                        const opt = document.createElement('option');
                        opt.value = file;
                        opt.innerText = "3D: " + file.replace(/\.(glb|gltf)$/i, '');
                        if (file === data.current) opt.selected = true;
                        settingAvatar.appendChild(opt);
                    });
                    break;

                case 'state_change':
                    setState(data.state, data.message);
                    break;

                case 'chunk':
                    if (data.isFirst) {
                        responseBox.innerText = data.text;
                    } else {
                        responseBox.innerText += data.text;
                    }
                    responseBox.scrollTop = responseBox.scrollHeight;
                    break;

                case 'audio_energy':
                    targetEnergy = data.energy;
                    break;
            }
        }

        const busySpinner = document.getElementById('busySpinner');
        const stopActionBtn = document.getElementById('stopActionBtn');

        function setState(state, message) {
            statusText.innerText = message || state;
            switch(state) {
                case 'listening':
                    isListening = true;
                    isSpeaking = false;
                    isProcessing = false;
                    micBtn.classList.add('active');
                    targetEnergy = 0.8;
                    statusDot.style.background = "#ff3344";
                    statusDot.style.boxShadow = "0 0 10px #ff3344";
                    busySpinner.classList.add('active');
                    busySpinner.style.borderTopColor = "#ff3344";
                    stopActionBtn.classList.add('visible');
                    break;

                case 'processing':
                    isListening = false;
                    isSpeaking = false;
                    isProcessing = true;
                    micBtn.classList.remove('active');
                    targetEnergy = 0.5;
                    statusDot.style.background = "#ffbb00";
                    statusDot.style.boxShadow = "0 0 10px #ffbb00";
                    busySpinner.classList.add('active');
                    busySpinner.style.borderTopColor = "#ffbb00";
                    stopActionBtn.classList.add('visible');
                    break;

                case 'speaking':
                    isListening = false;
                    isSpeaking = true;
                    isProcessing = false;
                    micBtn.classList.remove('active');
                    statusDot.style.background = "#00f0ff";
                    statusDot.style.boxShadow = "0 0 10px #00f0ff";
                    busySpinner.classList.add('active');
                    busySpinner.style.borderTopColor = "#00f0ff";
                    stopActionBtn.classList.add('visible');
                    break;

                case 'idle':
                default:
                    isListening = false;
                    isSpeaking = false;
                    isProcessing = false;
                    micBtn.classList.remove('active');
                    targetEnergy = 0.2;
                    statusDot.style.background = "#00ffaa";
                    statusDot.style.boxShadow = "0 0 8px #00ffaa";
                    busySpinner.classList.remove('active');
                    stopActionBtn.classList.remove('visible');
                    break;
            }
        }

        // Stop Action Button
        stopActionBtn.addEventListener('click', () => {
            setState('idle', 'PŘIPRAVEN K PŘÍKAZU');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "stop_all" }));
            }
        });


        // --- User Actions ---
        function sendTextMessage() {
            const text = chatInput.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            chatInput.value = '';
            responseBox.innerText = "⏳ Přemýšlím...";
            setState('processing', 'ZPRACOVÁVÁM...');
            ws.send(JSON.stringify({
                action: 'query',
                text: text,
                model: modelSelect.value,
                voice: voiceToggle.checked
            }));
        }

        function toggleMic() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (isListening) {
                ws.send(JSON.stringify({ action: 'stop_listen' }));
            } else {
                ws.send(JSON.stringify({ 
                    action: 'start_listen',
                    model: modelSelect.value,
                    voice: voiceToggle.checked 
                }));
            }
        }

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });
        sendBtn.addEventListener('click', sendTextMessage);
        micBtn.addEventListener('click', toggleMic);
        document.getElementById('avatarBtn').addEventListener('click', toggleMic);

        modelSelect.addEventListener('change', () => {
            const newModel = modelSelect.value;
            responseBox.innerText = `Systém přepnut na model: ${newModel}. Vše připraveno.`;
            chatInput.value = '';
            setState('idle', 'PŘIPRAVEN K PŘÍKAZU');
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'set_model',
                    model: newModel
                }));
            }
        });

        // Maximize / Restore Toggle
        const maximizeAppBtn = document.getElementById('maximizeAppBtn');
        let isMaximized = false;
        function toggleMaximize() {
            isMaximized = !isMaximized;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "toggle_maximize" }));
            }
        }
        maximizeAppBtn.addEventListener('click', toggleMaximize);
        document.querySelector('.drag-bar').addEventListener('dblclick', toggleMaximize);

        // Close Application Button - immediate exit
        closeAppBtn.addEventListener('click', () => {

            if (ws && ws.readyState === WebSocket.OPEN) {
                try {
                    ws.send(JSON.stringify({ action: 'quit_app' }));
                } catch(e) {}
            }
            document.body.style.display = 'none';
            setTimeout(() => { window.close(); }, 50);
        });

        // Settings Panel Handlers
        openSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.add('open');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: "get_avatars" }));
            }
        });

        closeSettingsBtn.addEventListener('click', () => {
            settingsPanel.classList.remove('open');
        });

        settingAvatar.addEventListener('change', () => {
            load3DAvatar(settingAvatar.value);
        });

        // Marketplace buttons
        document.getElementById('btnSketchfab').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({ action: "open_market", url: "https://sketchfab.com/search?features=downloadable&type=models&q=avatar" }));
        });

        document.getElementById('btnModelsResource').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({ action: "open_market", url: "https://www.models-resource.com/" }));
        });

        document.getElementById('btnOpenFolder').addEventListener('click', () => {
            if (ws) ws.send(JSON.stringify({ action: "open_avatar_folder" }));
        });

        saveSettingsBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    action: 'save_config',
                    avatar: settingAvatar.value,
                    voice: settingVoice.value,
                    context: settingContext.value
                }));
            }
            settingsPanel.classList.remove('open');
        });

        // --- Hologram / Arc Reactor Animation Canvas ---
        const canvas = document.getElementById('avatarCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;
        const centerX = W / 2;
        const centerY = H / 2;
        let angle = 0;

        function drawHologram() {
            currentEnergy += (targetEnergy - currentEnergy) * 0.15;
            angle += 0.02 + currentEnergy * 0.04;

            if (!is3DMode) {
                ctx.clearRect(0, 0, W, H);

                const scale = 1 + currentEnergy * 0.35;
                avatarGlow.style.transform = `scale(${scale})`;
                avatarGlow.style.opacity = (0.3 + currentEnergy * 0.7).toString();

                let primaryColor = "rgba(0, 240, 255, ";
                let innerCore = "#00f0ff";
                if (isListening) {
                    primaryColor = "rgba(255, 60, 80, ";
                    innerCore = "#ff3355";
                } else if (isProcessing) {
                    primaryColor = "rgba(255, 200, 30, ";
                    innerCore = "#ffc81e";
                }

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle);

                ctx.beginPath();
                ctx.arc(0, 0, 78, 0, Math.PI * 2);
                ctx.strokeStyle = primaryColor + "0.2)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 78, 0, Math.PI * 0.8);
                ctx.strokeStyle = primaryColor + "0.85)";
                ctx.lineWidth = 3.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 78, Math.PI, Math.PI * 1.8);
                ctx.strokeStyle = primaryColor + "0.85)";
                ctx.lineWidth = 3.5;
                ctx.stroke();

                const numTicks = 20;
                for (let i = 0; i < numTicks; i++) {
                    const rad = (i / numTicks) * Math.PI * 2;
                    const r1 = 70;
                    const r2 = (i % 4 === 0) ? 63 : 67;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(rad) * r1, Math.sin(rad) * r1);
                    ctx.lineTo(Math.cos(rad) * r2, Math.sin(rad) * r2);
                    ctx.strokeStyle = primaryColor + "0.6)";
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                }
                ctx.restore();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(-angle * 1.4);

                ctx.beginPath();
                ctx.arc(0, 0, 54, 0, Math.PI * 2);
                ctx.strokeStyle = primaryColor + "0.3)";
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 10]);
                ctx.stroke();
                ctx.setLineDash([]);

                for (let i = 0; i < 3; i++) {
                    const startA = (i * Math.PI * 2) / 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, 42, startA, startA + Math.PI / 3);
                    ctx.strokeStyle = primaryColor + "0.9)";
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
                ctx.restore();

                ctx.save();
                ctx.translate(centerX, centerY);
                const coreRadius = 20 + currentEnergy * 14;
                const grad = ctx.createRadialGradient(0, 0, 2, 0, 0, coreRadius);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, innerCore);
                grad.addColorStop(1, primaryColor + '0)');

                ctx.beginPath();
                ctx.arc(0, 0, coreRadius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = innerCore;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(drawHologram);
        }

        initThreeJS();
        drawHologram();
        connectWebSocket();
    </script>
</body>
</html>
